<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#5b2bd9"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="260" fill="#fff" opacity=".05"/>
  <circle cx="60" cy="620" r="220" fill="#fff" opacity=".05"/>

  <!-- Texto -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="90" y="250" font-size="84" font-weight="700">Webhook Tool</text>
    <text x="92" y="320" font-size="32" fill="#ddd6fe">Follow-ups padronizados,</text>
    <text x="92" y="364" font-size="32" fill="#ddd6fe">a um clique do navegador.</text>
    <g font-size="22" font-weight="600">
      <rect x="92" y="420" width="130" height="44" rx="22" fill="#fff" opacity=".16"/>
      <text x="157" y="450" text-anchor="middle">Make</text>
      <rect x="234" y="420" width="110" height="44" rx="22" fill="#fff" opacity=".16"/>
      <text x="289" y="450" text-anchor="middle">n8n</text>
      <rect x="356" y="420" width="190" height="44" rx="22" fill="#fff" opacity=".16"/>
      <text x="451" y="450" text-anchor="middle">Manifest V3</text>
    </g>
  </g>

  <!-- Painel da extensao -->
  <g filter="url(#sh)">
    <rect x="720" y="90" width="440" height="460" rx="22" fill="#fff"/>
    <path d="M720 112a22 22 0 0 1 22-22h396a22 22 0 0 1 22 22v50H720z" fill="#f5f3ff"/>
    <rect x="746" y="108" width="38" height="38" rx="11" fill="#7c3aed"/>
    <path d="M756 132v-5a9 9 0 0 1 18 0v5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <rect x="753" y="130" width="6" height="10" rx="3" fill="#fff"/><rect x="771" y="130" width="6" height="10" rx="3" fill="#fff"/>
    <text x="798" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Webhook Tool</text>
    <path d="M1136 119l16 16M1152 119l-16 16" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <rect x="746" y="184" width="186" height="48" rx="12" fill="#f3f4f6"/>
      <text x="839" y="215" text-anchor="middle" font-size="18" font-weight="600" fill="#374151">Fastspring</text>
      <rect x="948" y="184" width="186" height="48" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
      <text x="1041" y="215" text-anchor="middle" font-size="18" font-weight="600" fill="#3730a3">Confirm Link</text>

      <text x="746" y="278" font-size="14" font-weight="700" fill="#6b7280" letter-spacing="1.5">RECIPIENT EMAIL</text>
      <rect x="746" y="290" width="388" height="48" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
      <text x="766" y="321" font-size="18" fill="#9ca3af">user@email.com</text>

      <text x="746" y="376" font-size="14" font-weight="700" fill="#6b7280" letter-spacing="1.5">CONFIRMATION LINK</text>
      <rect x="746" y="388" width="388" height="48" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
      <text x="766" y="419" font-size="18" fill="#9ca3af">Paste link or text here...</text>

      <rect x="746" y="466" width="388" height="52" rx="14" fill="url(#btn)"/>
      <text x="940" y="499" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Submit</text>
    </g>
  </g>

  <!-- Seta para o webhook -->
  <g stroke="#c4b5fd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M1180 320h40"/><path d="M1208 306l14 14-14 14"/>
  </g>
</svg>
